<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="Content-Security-Policy" content="script-src 'self' https://cdn.jsdelivr.net 'unsafe-inline'; object-src 'none'; base-uri 'self'">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BLT Hackathons - Open Source Hackathon Platform</title>
    <meta name="description" content="Browse and participate in open source hackathons">
    <!-- build-stamp: tailwind-cdn-removed-20260329 -->
    
    <!-- Precompiled Tailwind CSS (production-safe; avoids the runtime CDN compiler) -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css">
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
        }
        .hackathon-card {
            transition: transform 0.25s cubic-bezier(0.4, 0, 0.2, 1), box-shadow 0.25s ease;
        }
        @media (max-width: 640px) {
            .btn-text { display: none; }
        }
    </style>
</head>
<body class="bg-gray-50 antialiased">
    <nav class="bg-white shadow-md sticky top-0 z-40">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between items-center h-16">
                <div class="flex items-center">
                    <i class="fas fa-trophy text-red-600 text-2xl mr-3"></i>
                    <h1 class="text-xl font-bold text-gray-900" id="site-title">BLT Hackathons</h1>
                </div>
                <div class="flex items-center space-x-2">
                    <a href="https://github.com/OWASP-BLT/BLT-Hackathons" target="_blank" 
                       class="px-4 py-2 bg-red-600 text-white rounded-lg hover:bg-red-700 transition-colors font-medium flex items-center space-x-2 shadow-sm">
                        <i class="fab fa-github"></i>
                        <span class="btn-text">GitHub</span>
                    </a>
                </div>
            </div>
        </div>
    </nav>

    <div class="bg-gradient-to-br from-red-600 to-red-900 text-white py-12 lg:py-20">
        <div class="max-w-7xl mx-auto px-4 text-center">
            <h2 class="text-3xl lg:text-5xl font-extrabold mb-4" id="hero-title">Open Source Hackathons</h2>
            <p class="text-lg lg:text-2xl opacity-90 max-w-2xl mx-auto" id="hero-description">
                Join our community and contribute to high-impact open source projects.
            </p>
        </div>
    </div>

    <main class="max-w-7xl mx-auto px-4 py-12">
        <div class="flex flex-col md:flex-row md:justify-between md:items-center mb-8 gap-6">
            <h2 class="text-2xl font-bold text-gray-900">Available Hackathons</h2>
            <div class="flex flex-wrap gap-2 p-1 bg-gray-100 rounded-xl">
                <button onclick="filterHackathons('all')" class="filter-btn px-4 py-2 rounded-lg bg-red-600 text-white font-semibold text-sm" data-filter="all">All</button>
                <button onclick="filterHackathons('ongoing')" class="filter-btn px-4 py-2 rounded-lg text-gray-600 font-semibold text-sm hover:bg-gray-200" data-filter="ongoing">Ongoing</button>
                <button onclick="filterHackathons('upcoming')" class="filter-btn px-4 py-2 rounded-lg text-gray-600 font-semibold text-sm hover:bg-gray-200" data-filter="upcoming">Upcoming</button>
                <button onclick="filterHackathons('ended')" class="filter-btn px-4 py-2 rounded-lg text-gray-600 font-semibold text-sm hover:bg-gray-200" data-filter="ended">Ended</button>
            </div>
        </div>
        
        <div id="hackathons-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6 lg:gap-8">
            <div class="col-span-full text-center py-20">
                <div class="inline-block animate-spin rounded-full h-12 w-12 border-4 border-gray-200 border-t-red-600"></div>
                <p class="mt-4 text-gray-500">Fetching hackathon data...</p>
            </div>
        </div>
        
        <div id="no-hackathons" class="hidden text-center py-20 bg-white rounded-2xl border-2 border-dashed border-gray-200">
            <i class="fas fa-calendar-times text-6xl text-gray-200 mb-4"></i>
            <p class="text-xl text-gray-500 font-medium">No hackathons found</p>
        </div>
    </main>

    <footer class="bg-gray-900 text-white py-12">
        <div class="max-w-7xl mx-auto px-4 text-center">
            <div id="github-api-info" class="mb-6 p-4 bg-gray-800 rounded-xl inline-block"></div>
            <p class="text-gray-500 text-sm">&copy; 2026 OWASP Foundation. Managed by BLT Project Team.</p>
        </div>
    </footer>

    <script src="js/hackathons-config.js"></script>
    <script src="js/index.js"></script>
</body>
</html>
